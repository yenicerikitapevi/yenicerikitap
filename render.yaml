services:
  - type: web
    name: yenicerikitap
    runtime: docker
    plan: starter
    # Kalıcı disk: SQLite veritabanı yeniden başlatma ve deploy sonrasında korunur
    disk:
      name: yeniceri-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_DRIVER
        value: sqlite
      - key: SQLITE_PATH
        value: /var/data/yeniceri.db
      # İlk kurulumda yönetici parolası; Render panelinde Environment sekmesinden görülebilir
      - key: ADMIN_PASSWORD
        generateValue: true
      # Ziyaret kaydı sigortaları (bot/saldırı dalgasında disk dolmasın). 0 = kaydı tamamen kapat.
      - key: ANALYTICS_ENABLED
        value: "1"
      - key: ANALYTICS_MAX_PER_MINUTE
        value: "600"
      - key: ANALYTICS_MAX_PER_SESSION_MINUTE
        value: "40"
      - key: ANALYTICS_MAX_ROWS
        value: "1000000"
